[workspace]
resolver = "2"
members = ["crates/*", "tools/parity/runner"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/rep0rtDev/gmod-rust"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"
tracing = "0.1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.12", features = ["luau", "send", "vendored", "serialize"] }

[profile.release]
debug = 1

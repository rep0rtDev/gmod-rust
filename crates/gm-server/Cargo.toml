[package]
name = "gm-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Server tick: players (gm-move), sandbox commands (gm-sandbox) and rigid bodies with constraints (gm-physics) in one fixed step"

[dependencies]
gm-core = { path = "../gm-core" }
gm-collision = { path = "../gm-collision" }
gm-move = { path = "../gm-move" }
gm-physics = { path = "../gm-physics" }
gm-sandbox = { path = "../gm-sandbox" }
glam = { workspace = true }

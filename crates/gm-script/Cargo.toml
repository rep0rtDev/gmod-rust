[package]
name = "gm-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Addon runtime: Luau actors (one VM each) with a parallel read-only phase over a world snapshot, a serial phase applying queued writes in priority order, CPU/memory budgets, restart on error"

[dependencies]
gm-core = { path = "../gm-core" }
gm-collision = { path = "../gm-collision" }
gm-move = { path = "../gm-move" }
gm-net = { path = "../gm-net" }
gm-sandbox = { path = "../gm-sandbox" }
gm-server = { path = "../gm-server" }
mlua = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
wasmtime = { version = "30", default-features = false, features = ["cranelift", "runtime", "wat"] }
serde_json = "1"

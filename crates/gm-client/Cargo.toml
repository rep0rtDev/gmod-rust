[package]
name = "gm-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Playable client: window, live world render, input, in-process server over the loopback"

[dependencies]
gm-core = { path = "../gm-core" }
gm-formats = { path = "../gm-formats" }
gm-content = { path = "../gm-content" }
gm-collision = { path = "../gm-collision" }
gm-move = { path = "../gm-move" }
gm-server = { path = "../gm-server" }
gm-net = { path = "../gm-net" }
gm-render = { path = "../gm-render" }
gm-audio = { path = "../gm-audio" }
gm-dedicated = { path = "../gm-dedicated" }
gm-script = { path = "../gm-script" }
glam = { workspace = true }
anyhow = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
winit = "0.30"

[[bin]]
name = "gm-client"
path = "src/main.rs"
